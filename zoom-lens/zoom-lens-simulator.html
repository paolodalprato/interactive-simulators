.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}

.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}

.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}

.tb-shade{fill:var(--anatomy-shade-0);stroke:none}

.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}

@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}

.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}

.iso-plate .iso-svg{margin:0 auto}

.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}

.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}

hes the corners of the frame, and on the sensor plane it ends on the circle that touches those corners. The aperture ring closes the blades and widens the zone in focus. With Focal length selected, moving the pointer sideways changes only the focal length. With Aperture selected it changes only the f-number. The left and right arrow keys do the same. While Focal length is selected the zone in focus stays visible but dimmed, because it also depends on the focal length. The drawing is qualitative and comes from a simplified model with two lens groups. A real 24-70 has 15 to 20 elements in several groups and a focusing group, which is not drawn here.</span></figcaption></figure><div class="zm-credits"><a class="zm-owner" href="https://www.ai-know.pro/" target="_blank" rel="noopener noreferrer"><img alt="" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAQdUlEQVR42u3be5TdV1UH8M8+v9+9dyYzk2nzapq+aGqgsS2l1VAsVSgWoeWN6FJBwWVRFmpdisUCChSWIIigWCwsX1VRu7C8odLQCtRHFVKpFAqUKFBIWwokTZrnzNz7849z7szNzJ1kYgks1+pe667cub/HOWef/fju7z7hIXlIHpKH5ChLtzv7tY3RCFJS4WE4HSMQodX/XlXf61l/B+W97539+jRcftyqKiJciv/GvXhbXZvAU3AZpPTdmVsclZfmt1ZNYwPOwr4IW8rvk01jd9O4Ud59mMbPpMo/Nz3Lsa1p/IBsIV/DrXjgu6OSI5RVq8ZBPdpOqVNF3WJkVI0X4avoYgpbIlwIKTkVX0Ez8PnFcu04/CV2ld9349oIJ0IrPSza9XjqtNvRGWl9bxd/1osfC1I4E+/AL3U6UoTH4VvzFtjg1ggnjoyo8cdFOQ1ujyjWEF435LkGf7x6tYQfxJ/heVWl+m65ylA5dX2d5xyuLJP8ckpOwRsXWcQ0frw8fiyeL1we4ZGQKivx6UWe3SpbwR+Wvz+dklUPVgH1g3l4794aM/BP+DHcWlW+1esZX+SRinKtSvfr9t6n0WnYEUHTU8uZYph0gpawuWlcgOtTsrNpHpwCHoziTsE5OClCHWGyqmbT2c8XzczfxXvwKIzhpXJwuxPX4ty6VuOdhlvADXVtHBHh2KrSJo7F2ThzVrHfBVmB1+F/sL0s4GURxiNyBkjJClw3bwH78DvttgpXyO4weP1TOEn28TvmXbsrwhPJ+GBsTOAS/LMca+7DB3EuRymF1jWjoyq8Hr15E5zCb5ZbW1gTyQlloR+So/hzI4wIqwz38x5eCBHOwpvKs1dFeEywur/LER4tZ5j57/jXCOvgO+0aUXZ3Pb5suIl+Fmtkt/hYhNMFdUu7k6O+8o5TDvGOV8LICMvGpHZbe3JSpDCGd+PXy3z+cJHnZ/C8I1nYUo1lWdN4JI6To/cwOS7C6pTcFeHqlNxTJWamTR3YnyNlkW/hC0Oe3ytbhte+lr179KamTO3Zo6lq+yNcE+Hm0WWzEHqYVFgX4ftw8lIWdtgsUNDbWEFmt5QFTA659d4I25vGtzXxnm6v2ah // Optical model of the figure: a two-group zoom (negative front group,
// positive rear group) on a full-frame sensor, plus standard depth-of-field
// formulas. All lengths in mm, measured along the axis from the sensor plane.
// Every number the page shows comes from these functions.

const F_FRONT = -50;
const F_REAR = 40;
const F_MIN = 24;
const F_MAX = 70;
const TURN = 75; // zoom ring travel in degrees, 24 mm at 0, 70 mm at TURN
const HALF_W = 18; // full frame 36 x 24 mm
const HALF_H = 12;
const HALF_D = Math.hypot(18, 12); // half the frame diagonal, radius of the image circle
const COC = 0.03; // circle of confusion for full frame
const FOCUS = 2000; // subject distance from the sensor plane
const STOPS = [2.8, 4, 5.6, 8, 11, 16];
const STOP_TURN = 9; // aperture ring degrees per stop

// The ring scale is logarithmic in focal length, as on most real zooms.
function focalAt(turn) {
  return F_MIN * Math.pow(F_MAX / F_MIN, turn / TURN);
}

function turnOf(focal) {
  return (TURN * Math.log(focal / F_MIN)) / Math.log(F_MAX / F_MIN);
}

// Thin-lens positions that give this focal length with the image of a far
// subject on the sensor: d from f = f1 f2 / (f1 + f2 - d), back focus from
// the two-lens formula. The stop rides STOP_AHEAD mm in front of the rear
// group, so the entrance pupil is the stop imaged backwards through the
// front group.
const STOP_AHEAD = 9;
function groupsAt(focal) {
  const gap = F_FRONT + F_REAR - (F_FRONT * F_REAR) / focal;
  const rear = (F_REAR * (gap - F_FRONT)) / (gap - F_FRONT - F_REAR);
  const front = rear + gap;
  const toStop = gap - STOP_AHEAD;
  const image = (F_FRONT * toStop) / (toStop - F_FRONT); // negative: virtual pupil behind the front group
  return { rear, front, gap, stop: rear + STOP_AHEAD, pupil: front + image, reach: -image };
}

// Paraxial path of the ray from the edge of the frame (half its width or
// height), from
// the front group through the centre of the stop and the rear group to the
// sensor. Returns [x, height] points from front to sensor.
function chiefRay(focal, half = HALF_W) {
  const g = groupsAt(focal);
  const h1 = (g.reach * half) / focal;
  const slope = h1 / (g.front - g.stop); // height lost per mm towards the sensor
  const h2 = -slope * (g.stop - g.rear);
  const u = -slope - h2 / F_REAR; // after the rear group, still per mm towards the sensor
  return [[g.front, h1], [g.stop, 0], [g.rear, h2], [0, h2 + u * g.rear]];
}

function angleOf(focal, half = HALF_W) {
  return (2 * Math.atan(half / focal) * 180) / Math.PI;
}

// Classic hyperfocal formulas, subject distance s from the sensor plane.
function sharpZone(focal, stop, s = FOCUS) {
  const hyper = (focal * focal) / (stop * COC) + focal;
  const near = (s * (hyper - focal)) / (hyper + s - 2 * focal);
  const far = s < hyper ? (s * (hyper - focal)) / (hyper - s) : Infinity;
  return { near, far, hyper };
}

  // The same zone marked on the ruler, like the depth-of-field scale of a lens.
  const r0 = Math.max(near, 0.5), r1 = Math.min(far, D_MAX);
  const mark = r1 > r0 ? `<path class="zm-dof" fill-opacity="${(0.45 * strength).toFixed(2)}" d="${pathOf([[X(r0), RULER.y + 0.05, RULER.z0], [X(r1), RULER.y + 0.05, RULER.z0], [X(r1), RULER.y + 0.05, RULER.z1], [X(r0), RULER.y + 0.05, RULER.z1]].map(at), true)}"/>` : "";
  return { field: out.join(""), mark, depth };
}

// Rays from the top and bottom edges of the frame, through the stop, to the sensor.
function raysSvg(focal) {
  const ray = chiefRay(focal, HALF_D);
  const d = [1, -1].map((s) => lineC(ray.map(([x, h]) => [x, s * h]))).join("");
  const dots = [1, -1].flatMap((s) => [ray[0], ray[3]].map(([x, h]) => at(cut(x, s * h)))).map(([x, y]) => `<circle r="0.7" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}"/>`).join("");
  return `<path class="iso-line zm-ray" data-tone="hi" style="stroke-width:.8" d="${d}"/><g class="iso-dots zm-ray-dot" data-tone="hi">${dots}</g>`;
}

const el = { rear: part("rear"), front: part("front"), slots: part("slots"), rays: part("rays"), iris: part("iris"), fov: part("fov"), mark: part("dof-ruler") };

function draw(turn, stopPos) {
  const focal = focalAt(turn);
  const low = Math.floor(stopPos), high = Math.min(STOPS.length - 1, low + 1);
  const stop = STOPS[low] * Math.pow(STOPS[high] / STOPS[low], stopPos - low);
  const g = groupsAt(focal);
  el.rear.setAttribute("transform", translateAlong(P, [g.rear, 0, 0]));
  el.front.setAttribute("transform", translateAlong(P, [g.front, 0, 0]));
  el.slots.innerHTML = slotPaths("rear", turn) + slotPaths("front", turn);
  el.iris.setAttribute("d", irisPath(stop));
  el.rays.innerHTML = raysSvg(focal);
  const field = fieldSvg(focal, stop, mode === "focal");
  el.fov.innerHTML = field.field;
  el.mark.innerHTML = field.mark;
  const T = TEXT[lang];
  // The values that the selected setting changes are set in bold. The zone
  // in focus is shown only in the drawing: the figure is qualitative.
  const parts = [
    [`${Math.round(focal)} mm`, mode === "focal", "focal"],
    [`f/${stopLabel(STOPS[Math.round(stopPos)])}`, mode === "stop", "stop"],
    [`${Math.round(angleOf(focal, HALF_D))}° ${T.diagonal}`, mode === "focal", "focal"],
  ];
  const text = parts.map(([t]) => t).join(" · ");
  const html = parts.map(([t, on, kind]) => (on ? `<b data-kind="${kind}">${t}</b>` : t)).join(" · ");
  if (readout.innerHTML !== html) readout.innerHTML = html;
  stage.setAttribute("aria-valuetext", text);
  stage.setAttribute("aria-valuenow", String(Math.round(mode === "focal" ? (100 * turn) / TURN : (100 * stopPos) / (STOPS.length - 1))));
}

// Texts follow the selected language: corners, buttons, legend, caption.
function applyLanguage() {
  const T = TEXT[lang];
  document.documentElement.lang = lang;
  document.title = T.title;
  plate.querySelector('[data-corner="title"]').textContent = T.title;
  plate.querySelector('[data-corner="hint"]').textContent = T.hint;
  document.querySelectorAll("[data-i18n]").forEach((node) => { node.textContent = T[node.dataset.i18n]; });
  plate.querySelectorAll("[data-i18n-label]").forEach((node) => node.setAttribute("aria-label", T[node.dataset.i18nLabel]));
  plate.querySelectorAll(".iso-key").forEach((node, i) => { node.lastChild.textContent = T.keys[i]; });
  plate.querySelector(".iso-caption").textContent = T.caption;
  stage.setAttribute("aria-label", T.stage);
  svg.setAttribute("aria-label", T.label);
  plate.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  draw(turn, stopPos);
}

// Motion: the selected ring follows its target with exponential easing.
let turn = 0, stopPos = 0, wantTurn = 0, wantStop = 0;
let frame = 0, last = 0, visible = false;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  turn = calm ? wantTurn : turn + (wantTurn - turn) * (1 - Math.exp(-dt / 0.2));
  stopPos = calm ? wantStop : stopPos + (wantStop - stopPos) * (1 - Math.exp(-dt / 0.18));
  if (Math.abs(wantTurn - turn) < 0.01) turn = wantTurn;
  if (Math.abs(wantStop - stopPos) < 0.002) stopPos = wantStop;
  draw(turn, stopPos);
  frame = visible && !(turn === wantTurn && stopPos === wantStop) ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);

// The pointer's horizontal position sets only the selected setting.
function steerTo(share) {
  if (mode === "focal") wantTurn = share * TURN;
  else wantStop = Math.round(share * (STOPS.length - 1));
  run();
}
const shareAt = (event) => {
  const box = svg.getBoundingClientRect();
  return clamp(((event.clientX - box.left) / box.width - 0.1) / 0.8, 0, 1);
};
stage.addEventListener("pointermove", (event) => { if (event.pointerType === "mouse" || event.buttons) steerTo(shareAt(event)); });
stage.addEventListener("pointerdown", (event) => steerTo(shareAt(event)));
stage.addEventListener("keydown", (event) => {
  const dir = event.key === "ArrowRight" ? 1 : event.key === "ArrowLeft" ? -1 : 0;
  if (!dir) return;
  event.preventDefault();
  if (mode === "focal") {
    const here = FOCALS.reduce((best, f, i) => (Math.abs(turnOf(f) - wantTurn) < Math.abs(turnOf(FOCALS[best]) - wantTurn) ? i : best), 0);
    wantTurn = turnOf(FOCALS[clamp(here + dir, 0, FOCALS.length - 1)]);
  } else wantStop = clamp(Math.round(wantStop) + dir, 0, STOPS.length - 1);
  run();
});
plate.querySelectorAll("[data-mode]").forEach((button) => button.addEventListener("click", () => {
  mode = button.dataset.mode;
  plate.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b === button)));
  draw(turn, stopPos);
}));
plate.querySelectorAll("[data-lang]").forEach((button) => button.addEventListener("click", () => {
  lang = button.dataset.lang;
  try { localStorage.setItem("zm-lang", lang); } catch (error) { /* storage blocked: the choice lasts for this visit */ }
  applyLanguage();
}));
applyLanguage();
</script></body></html>
